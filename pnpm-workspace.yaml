  # Keep this version in step with the vite-plus version in package.json.
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  # Use patched glob only for Vercel's file tracing dependency.
  '@vercel/nft@1.11.0>glob': 14.0.2
patchedDependencies:
