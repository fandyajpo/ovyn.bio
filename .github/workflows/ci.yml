name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # pnpm-workspace.yaml uses pnpm 10 settings (allowBuilds, overrides);
          # pnpm 9 rejects the file with "packages field missing or empty".
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type + lint gate, then the unit suite. Builds need no service
      # credentials (lazy handles).
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build
