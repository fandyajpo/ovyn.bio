<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#111210" />
		<title>Offline - OVYN</title>
		<style>
			:root { color-scheme: dark; --bg: #111210; --panel: #1b1d19; --ink: #f1f0e9; --muted: #92958a; --accent: #d5ff35; }
			:root[data-theme='light'] { color-scheme: light; --bg: #fff6e9; --panel: #fffdf8; --ink: #28233d; --muted: #70677a; --accent: #e7b953; }
			* { box-sizing: border-box; }
			body { min-height: 100svh; margin: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 20% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 45%), var(--bg); color: var(--ink); font: 16px/1.55 system-ui, sans-serif; padding: 1.5rem; }
			main { width: min(100%, 28rem); border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); border-radius: 1.75rem; background: var(--panel); padding: 2rem; box-shadow: 7px 7px 0 color-mix(in srgb, var(--accent) 22%, transparent); }
			.brand { display: inline-flex; align-items: center; gap: .65rem; font-weight: 800; letter-spacing: -.04em; }
			.brand-mark { display: grid; width: 2.25rem; height: 2.25rem; place-items: center; border-radius: .7rem; background: var(--accent); color: var(--bg); font-weight: 900; }
			h1 { margin: 2rem 0 .5rem; font-size: clamp(2rem, 8vw, 3rem); letter-spacing: -.06em; line-height: 1.05; }
			p { color: var(--muted); }
			button { min-height: 2.75rem; margin-top: 1rem; border: 0; border-radius: .8rem; background: var(--accent); color: var(--bg); padding: .75rem 1rem; font: inherit; font-weight: 700; }
		</style>
		<script>
			try { const theme = localStorage.getItem('ovyn-theme'); if (theme === 'light') document.documentElement.dataset.theme = 'light'; } catch {}
		</script>
	</head>
	<body>
		<main>
			<div class="brand"><span class="brand-mark">O</span><span>OVYN</span></div>
			<h1>You’re offline.</h1>
			<p>Your corner is still here. Reconnect to load profiles, guilds and account updates.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
